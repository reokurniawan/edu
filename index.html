<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyIgi - MA Insan Generasi Islami</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0f5132;--g2:#157347;--gold:#c8962e;--bg:#f6f4ee;--ink:#1c2b24}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.btn{background:var(--g);color:#fff;border-radius:.75rem;padding:.6rem 1rem;font-weight:700;font-size:.875rem}
.btn:hover{background:var(--g2)}.btn2{background:#fff;border:1px solid #d6d3c7;border-radius:.75rem;padding:.5rem .9rem;font-weight:600;font-size:.8rem}
.inp{width:100%;border:1px solid #d6d3c7;border-radius:.75rem;padding:.6rem .8rem;background:#fff;font-size:.9rem}
.card{background:#fff;border:1px solid #e5e2d6;border-radius:1rem;padding:1rem}
.tab{padding:.5rem .9rem;border-radius:999px;font-weight:700;font-size:.8rem;white-space:nowrap;background:#fff;border:1px solid #d6d3c7}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.hero{background:linear-gradient(135deg,#0f5132,#157347 60%,#1f8a5b);color:#fff;border-radius:1.25rem;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(200,150,46,.35)}
.pill{font-size:.7rem;font-weight:700;padding:.15rem .6rem;border-radius:999px}
.hidden{display:none}
</style>
</head>
<body>
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-sm space-y-4 p-6">
    <div class="text-center"><div class="text-3xl font-extrabold" style="color:var(--g)">MyIgi</div><p class="text-sm text-slate-500">MA Insan Generasi Islami</p></div>
    <input id="u" class="inp" placeholder="NISN" inputmode="numeric">
    <input id="p" type="password" class="inp" placeholder="Sandi (ddmmyyyy, contoh 12092004)">
    <p id="err" class="text-sm text-rose-600 hidden"></p>
    <button class="btn w-full" onclick="doLogin()">Masuk</button>
  </div>
</div>

<div id="app" class="hidden max-w-5xl mx-auto p-4 space-y-4">
  <header class="flex items-center justify-between">
    <div><div class="font-extrabold text-xl" style="color:var(--g)">MyIgi</div><div class="text-xs text-slate-500">MA Insan Generasi Islami</div></div>
    <button class="btn2" onclick="logout()">Keluar</button>
  </header>
  <nav id="tabs" class="flex gap-2 overflow-x-auto pb-1"></nav>
  <main id="main"></main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import {getFirestore,collection,getDocs,doc,setDoc,addDoc,updateDoc,deleteDoc,getDoc,writeBatch} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// === GANTI DENGAN CONFIG FIREBASE BARU ANDA (lihat langkah-langkah) ===
const firebaseConfig={apiKey:"AIzaSyClGgcUyZj16x1XpbGGFkIdbQC9OSqnvtw",authDomain:"apa-1c339.firebaseapp.com",projectId:"apa-1c339",storageBucket:"apa-1c339.firebasestorage.app",messagingSenderId:"446205639535",appId:"1:446205639535:web:3ac4916c616089f15f869a"};
const db=getFirestore(initializeApp(firebaseConfig));
const ADMIN={u:"admin",p:"maigi-admin-2026"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const all=async n=>(await getDocs(collection(db,n))).docs.map(d=>({id:d.id,...d.data()}));
const today=()=>new Date().toISOString().slice(0,10);
let me=null,isAdmin=false,tab="",siswa=[];

window.doLogin=async()=>{
  const u=$("u").value.trim(),p=$("p").value.trim();$("err").classList.add("hidden");
  try{
    if(u===ADMIN.u){ if(p!==ADMIN.p)throw 0; isAdmin=true; me={nama:"Admin"}; }
    else{ const s=await getDoc(doc(db,"siswa",u)); if(!s.exists()||s.data().tgl!==p)throw 0; me=s.data(); isAdmin=false; }
  }catch(e){$("err").textContent="NISN/username atau sandi salah.";$("err").classList.remove("hidden");return}
  sessionStorage.setItem("me",JSON.stringify({u,p}));
  start();
};
window.logout=()=>{sessionStorage.clear();location.reload()};
const saved=sessionStorage.getItem("me");
if(saved){const s=JSON.parse(saved);$("u").value=s.u;$("p").value=s.p;doLogin()}

function start(){
  $("login").classList.add("hidden");$("app").classList.remove("hidden");
  const t=isAdmin?["Siswa","Pelanggaran","Tugas","Prestasi","Absensi","Pembayaran","Bantuan"]:["Beranda","Pelanggaran","Tugas","Prestasi","Pembayaran","Bantuan"];
  $("tabs").innerHTML=t.map(x=>`<button class="tab" data-t="${x}" onclick="go('${x}')">${x}</button>`).join("");
  go(t[0]);
}
window.go=async n=>{
  tab=n;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===n));
  $("main").innerHTML='<p class="text-slate-500">Memuat…</p>';
  if(isAdmin)siswa=await all("siswa");
  $("main").innerHTML=await (isAdmin?A:S)[n]();
};
const opts=(a,sel)=>a.map(s=>`<option value="${s.nisn}">${esc(s.nama)} - ${esc(s.kelas)}</option>`).join("");
const empty=t=>`<p class="text-slate-500 text-sm">${t}</p>`;
const list=(a,f,e)=>a.length?a.map(f).join(""):empty(e);
const fileB64=f=>new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)});

// ============ SISWA ============
const S={
Beranda:async()=>{
  const [pel,pr,ab]=await Promise.all([all("pelanggaran"),all("prestasi"),all("absensi")]);
  const mine=a=>a.filter(x=>x.nisn===me.nisn);
  const alpha=mine(ab).filter(x=>x.status==="A").length;
  const pm=mine(pr),pl=mine(pel);
  return `<section class="hero p-6 space-y-3"><p class="text-sm opacity-80">Assalamu'alaikum,</p>
  <h1 class="text-2xl sm:text-3xl font-extrabold">${esc(me.nama)}</h1>
  <div class="grid grid-cols-3 gap-3 text-sm pt-2 max-w-md"><div><div class="opacity-70 text-xs">Nama</div><b>${esc(me.nama)}</b></div><div><div class="opacity-70 text-xs">Kelas</div><b>${esc(me.kelas)}</b></div><div><div class="opacity-70 text-xs">NISN</div><b>${esc(me.nisn)}</b></div></div></section>
  <section class="grid grid-cols-3 gap-3 mt-4">
   <div class="card text-center"><div class="text-3xl font-extrabold text-rose-600">${alpha}</div><div class="text-xs text-slate-500">Alpha</div></div>
   <div class="card text-center"><div class="text-3xl font-extrabold text-amber-600">${pl.length}</div><div class="text-xs text-slate-500">Pelanggaran</div></div>
   <div class="card text-center"><div class="text-3xl font-extrabold" style="color:var(--g)">${pm.length}</div><div class="text-xs text-slate-500">Prestasi</div></div></section>
  <section class="mt-4"><h2 class="font-extrabold mb-2">Prestasi Saya</h2><div class="space-y-2">${list(pm,x=>`<div class="card flex gap-3 items-center" style="border-left:4px solid var(--gold)"><div class="text-2xl">🏆</div><div><b>${esc(x.judul)}</b><div class="text-xs text-slate-500">${esc(x.tgl)} - ${esc(x.ket)}</div></div></div>`,"Belum ada prestasi.")}</div></section>`;
},
Pelanggaran:async()=>list((await all("pelanggaran")).filter(x=>x.nisn===me.nisn).sort((a,b)=>b.waktu>a.waktu?1:-1),x=>`<div class="card mb-2"><b>${esc(x.ket)}</b><div class="text-xs text-slate-500">${esc(x.waktu)}</div></div>`,"Tidak ada catatan pelanggaran."),
Tugas:async()=>{
  const t=(await all("tugas")).filter(x=>x.nisn===me.nisn).sort((a,b)=>b.tgl>a.tgl?1:-1);
  return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Kumpulkan tugas</h2>
  <input id="tm" class="inp" placeholder="Mata pelajaran"><input id="tj" class="inp" placeholder="Judul tugas">
  <input id="tl" class="inp" placeholder="Link tugas (opsional, mis. Google Drive)"><input id="tf" type="file" class="inp">
  <p class="text-xs text-slate-500">File maksimal 700 KB. Untuk file besar, pakai link.</p><button class="btn" onclick="kirimTugas()">Kirim tugas</button></div>`+
  list(t,x=>`<div class="card mb-2"><div class="flex justify-between gap-2"><b>${esc(x.judul)}</b><span class="pill ${x.status==="Selesai"?"bg-emerald-100 text-emerald-700":x.status==="Revisi"?"bg-amber-100 text-amber-700":"bg-slate-100"}">${esc(x.status)}</span></div><div class="text-xs text-slate-500">${esc(x.mapel)} - ${esc(x.tgl)}</div>${x.nilai!==""&&x.nilai!=null?`<div class="text-sm mt-1">Nilai: <b>${esc(x.nilai)}</b></div>`:""}</div>`,"Belum ada tugas dikirim.");
},
Prestasi:async()=>list((await all("prestasi")).filter(x=>x.nisn===me.nisn),x=>`<div class="card mb-2" style="border-left:4px solid var(--gold)">🏆 <b>${esc(x.judul)}</b><div class="text-xs text-slate-500">${esc(x.tgl)} - ${esc(x.ket)}</div></div>`,"Belum ada prestasi."),
Pembayaran:async()=>{
  const q=(await getDoc(doc(db,"pengaturan","qris"))).data()?.url;
  const p=(await all("pembayaran")).filter(x=>x.nisn===me.nisn);
  return `<div class="card space-y-3 mb-4"><h2 class="font-extrabold">Pembayaran</h2>
  ${q?`<img src="${esc(q)}" alt="QRIS" class="w-56 rounded-xl border">`:empty("QRIS belum tersedia. Bayar tunai ke bagian administrasi.")}
  <p class="text-sm">Bayar lewat QRIS atau tunai, lalu lapor di sini.</p>
  <select id="pm" class="inp"><option>QRIS</option><option>Tunai</option></select><input id="pj" type="number" class="inp" placeholder="Jumlah (Rp)"><input id="pk" class="inp" placeholder="Keterangan (mis. SPP Oktober)">
  <button class="btn" onclick="kirimBayar()">Kirim laporan</button></div>`+list(p,x=>`<div class="card mb-2 flex justify-between"><div><b>Rp ${Number(x.jumlah).toLocaleString("id-ID")}</b> - ${esc(x.metode)}<div class="text-xs text-slate-500">${esc(x.ket)} - ${esc(x.tgl)}</div></div><span class="pill bg-slate-100 h-fit">${esc(x.status)}</span></div>`,"Belum ada pembayaran.");
},
Bantuan:async()=>{
  const b=(await all("bantuan")).filter(x=>x.nisn===me.nisn);
  return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Butuh bantuan?</h2><textarea id="bp" class="inp" rows="3" placeholder="Tulis pesan Anda"></textarea><button class="btn" onclick="kirimBantuan()">Kirim</button></div>`+list(b,x=>`<div class="card mb-2"><p>${esc(x.pesan)}</p>${x.balasan?`<p class="text-sm mt-2 p-2 rounded-lg" style="background:#e8f3ec"><b>Admin:</b> ${esc(x.balasan)}</p>`:'<p class="text-xs text-slate-400 mt-1">Menunggu balasan</p>'}</div>`,"Belum ada pesan.");
}};

window.kirimTugas=async()=>{
  const m=$("tm").value.trim(),j=$("tj").value.trim(),l=$("tl").value.trim(),f=$("tf").files[0];
  if(!m||!j||(!l&&!f))return alert("Isi mapel, judul, dan link atau file.");
  if(f&&f.size>700000)return alert("File terlalu besar. Pakai link.");
  await addDoc(collection(db,"tugas"),{nisn:me.nisn,nama:me.nama,kelas:me.kelas,mapel:m,judul:j,link:l,file:f?await fileB64(f):"",namaFile:f?.name||"",tgl:today(),nilai:"",status:"Menunggu"});
  go("Tugas");
};
window.kirimBayar=async()=>{
  const j=$("pj").value;if(!j)return alert("Isi jumlah.");
  await addDoc(collection(db,"pembayaran"),{nisn:me.nisn,nama:me.nama,metode:$("pm").value,jumlah:+j,ket:$("pk").value,tgl:today(),status:"Menunggu"});go("Pembayaran");
};
window.kirimBantuan=async()=>{const t=$("bp").value.trim();if(!t)return;await addDoc(collection(db,"bantuan"),{nisn:me.nisn,nama:me.nama,pesan:t,balasan:""});go("Bantuan")};

// ============ ADMIN ============
const sel=(id)=>`<select id="${id}" class="inp">${opts(siswa)}</select>`;
const A={
Siswa:async()=>`<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Upload data siswa</h2><p class="text-xs text-slate-500">File .xlsx atau .csv dengan kolom: NAMA, KELAS, NISN, TGL LAHIR. Sandi siswa = tanggal lahir (ddmmyyyy).</p><input id="xf" type="file" accept=".xlsx,.xls,.csv" class="inp"><button class="btn" onclick="importSiswa()">Upload</button></div>
 <p class="text-sm mb-2">${siswa.length} siswa</p>`+list(siswa.sort((a,b)=>a.kelas>b.kelas?1:-1),x=>`<div class="card mb-2 flex justify-between"><div><b>${esc(x.nama)}</b><div class="text-xs text-slate-500">${esc(x.kelas)} - ${esc(x.nisn)}</div></div><button class="btn2" onclick="hapus('siswa','${x.id}','Siswa')">Hapus</button></div>`,"Belum ada data siswa."),
Pelanggaran:async()=>{const p=(await all("pelanggaran")).sort((a,b)=>b.waktu>a.waktu?1:-1);
 return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Input pelanggaran</h2>${sel("ps")}<input id="pk" class="inp" placeholder="Keterangan pelanggaran"><input id="pw" type="datetime-local" class="inp"><button class="btn" onclick="addPel()">Simpan</button></div>`+list(p,x=>`<div class="card mb-2 flex justify-between"><div><b>${esc(x.nama)}</b> (${esc(x.kelas)})<div class="text-sm">${esc(x.ket)}</div><div class="text-xs text-slate-500">${esc(x.waktu)}</div></div><button class="btn2" onclick="hapus('pelanggaran','${x.id}','Pelanggaran')">Hapus</button></div>`,"Belum ada pelanggaran.")},
Tugas:async()=>{const t=(await all("tugas")).sort((a,b)=>b.tgl>a.tgl?1:-1);const m=[...new Set(t.map(x=>x.mapel))];
 return `<div class="card mb-4"><select id="fm" class="inp" onchange="filterTugas()"><option value="">Semua pelajaran</option>${m.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div id="tl">${list(t,x=>`<div class="card mb-2 tg" data-m="${esc(x.mapel)}"><div class="flex justify-between gap-2"><div><b>${esc(x.judul)}</b><div class="text-xs text-slate-500">${esc(x.nama)} (${esc(x.kelas)}) - ${esc(x.mapel)} - ${esc(x.tgl)}</div></div><span class="pill bg-slate-100 h-fit">${esc(x.status)}</span></div>
 <div class="text-sm mt-1">${x.link?`<a class="underline text-emerald-700" target="_blank" href="${esc(x.link)}">Buka link</a> `:""}${x.file?`<a class="underline text-emerald-700" download="${esc(x.namaFile)}" href="${x.file}">Unduh ${esc(x.namaFile)}</a>`:""}</div>
 <div class="flex gap-2 mt-2"><input id="n${x.id}" class="inp" style="max-width:90px" placeholder="Nilai" value="${esc(x.nilai)}"><select id="s${x.id}" class="inp" style="max-width:130px">${["Menunggu","Revisi","Selesai"].map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select><button class="btn" onclick="nilai('${x.id}')">Simpan</button></div></div>`,"Belum ada tugas masuk.")}</div>`},
Prestasi:async()=>{const p=await all("prestasi");
 return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Input prestasi</h2>${sel("ps")}<input id="pj" class="inp" placeholder="Nama prestasi"><input id="pk" class="inp" placeholder="Keterangan (juara, tingkat)"><input id="pt" type="date" class="inp" value="${today()}"><button class="btn" onclick="addPrestasi()">Simpan</button></div>`+list(p,x=>`<div class="card mb-2 flex justify-between"><div>🏆 <b>${esc(x.judul)}</b> - ${esc(x.nama)}<div class="text-xs text-slate-500">${esc(x.tgl)} - ${esc(x.ket)}</div></div><button class="btn2" onclick="hapus('prestasi','${x.id}','Prestasi')">Hapus</button></div>`,"Belum ada prestasi.")},
Absensi:async()=>{const k=[...new Set(siswa.map(x=>x.kelas))].sort();
 return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Absensi siswa</h2><div class="flex gap-2"><select id="ak" class="inp" onchange="loadAbsen()"><option value="">Pilih kelas</option>${k.map(x=>`<option>${esc(x)}</option>`).join("")}</select><input id="at" type="date" class="inp" value="${today()}" onchange="loadAbsen()"></div></div><div id="ab"></div>`},
Pembayaran:async()=>{const p=(await all("pembayaran")).sort((a,b)=>b.tgl>a.tgl?1:-1);const q=(await getDoc(doc(db,"pengaturan","qris"))).data()?.url||"";
 return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Gambar QRIS</h2><input id="qu" class="inp" placeholder="Link gambar QRIS" value="${esc(q)}"><button class="btn" onclick="setQris()">Simpan QRIS</button></div>`+list(p,x=>`<div class="card mb-2"><b>${esc(x.nama)}</b> - Rp ${Number(x.jumlah).toLocaleString("id-ID")} (${esc(x.metode)})<div class="text-xs text-slate-500">${esc(x.ket)} - ${esc(x.tgl)}</div><div class="flex gap-2 mt-2"><span class="pill bg-slate-100">${esc(x.status)}</span><button class="btn2" onclick="bayarOk('${x.id}')">Tandai lunas</button></div></div>`,"Belum ada pembayaran.")},
Bantuan:async()=>list(await all("bantuan"),x=>`<div class="card mb-2"><b>${esc(x.nama)}</b><p class="text-sm">${esc(x.pesan)}</p><div class="flex gap-2 mt-2"><input id="r${x.id}" class="inp" placeholder="Balasan" value="${esc(x.balasan)}"><button class="btn" onclick="balas('${x.id}')">Kirim</button></div></div>`,"Belum ada pesan.")
};
const sw=n=>siswa.find(s=>s.nisn===n)||{};
window.hapus=async(c,id,t)=>{if(confirm("Hapus data ini?")){await deleteDoc(doc(db,c,id));go(t)}};
window.addPel=async()=>{const s=sw($("ps").value);if(!$("pk").value||!$("pw").value)return alert("Lengkapi keterangan dan waktu.");await addDoc(collection(db,"pelanggaran"),{nisn:s.nisn,nama:s.nama,kelas:s.kelas,ket:$("pk").value,waktu:$("pw").value.replace("T"," ")});go("Pelanggaran")};
window.addPrestasi=async()=>{const s=sw($("ps").value);if(!$("pj").value)return alert("Isi nama prestasi.");await addDoc(collection(db,"prestasi"),{nisn:s.nisn,nama:s.nama,judul:$("pj").value,ket:$("pk").value,tgl:$("pt").value});go("Prestasi")};
window.nilai=async id=>{await updateDoc(doc(db,"tugas",id),{nilai:$("n"+id).value,status:$("s"+id).value});alert("Tersimpan.")};
window.filterTugas=()=>{const v=$("fm").value;document.querySelectorAll(".tg").forEach(e=>e.style.display=!v||e.dataset.m===v?"":"none")};
window.setQris=async()=>{await setDoc(doc(db,"pengaturan","qris"),{url:$("qu").value});alert("Tersimpan.")};
window.bayarOk=async id=>{await updateDoc(doc(db,"pembayaran",id),{status:"Lunas"});go("Pembayaran")};
window.balas=async id=>{await updateDoc(doc(db,"bantuan",id),{balasan:$("r"+id).value});alert("Terkirim.")};
window.loadAbsen=async()=>{
  const k=$("ak").value,t=$("at").value;if(!k)return($("ab").innerHTML="");
  const ex=(await all("absensi")).filter(x=>x.kelas===k&&x.tgl===t);
  $("ab").innerHTML=siswa.filter(s=>s.kelas===k).sort((a,b)=>a.nama>b.nama?1:-1).map(s=>{const c=ex.find(x=>x.nisn===s.nisn)?.status||"H";
   return `<div class="card mb-2 flex justify-between items-center"><b class="text-sm">${esc(s.nama)}</b><div class="flex gap-3 text-sm">${["H","I","A"].map(v=>`<label><input type="radio" name="a${s.nisn}" value="${v}" ${v===c?"checked":""}> ${v}</label>`).join("")}</div></div>`}).join("")+`<button class="btn" onclick="saveAbsen()">Simpan absensi</button>`;
};
window.saveAbsen=async()=>{
  const k=$("ak").value,t=$("at").value,b=writeBatch(db);
  siswa.filter(s=>s.kelas===k).forEach(s=>{const v=document.querySelector(`input[name=a${s.nisn}]:checked`).value;b.set(doc(db,"absensi",`${t}_${s.nisn}`),{nisn:s.nisn,nama:s.nama,kelas:k,tgl:t,status:v})});
  await b.commit();alert("Absensi tersimpan.");
};
window.importSiswa=async()=>{
  const f=$("xf").files[0];if(!f)return alert("Pilih file.");
  const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
  const g=(r,k)=>r[Object.keys(r).find(h=>h.toLowerCase().includes(k))]??"";
  const fmt=v=>{if(v instanceof Date){const p=n=>String(n).padStart(2,"0");return p(v.getDate())+p(v.getMonth()+1)+v.getFullYear()}return String(v).replace(/\D/g,"")};
  let n=0,b=writeBatch(db);
  for(const r of rows){const nisn=String(g(r,"nisn")).trim(),nama=String(g(r,"nama")).trim();if(!nisn||!nama)continue;
   b.set(doc(db,"siswa",nisn),{nisn,nama,kelas:String(g(r,"kelas")).trim(),tgl:fmt(g(r,"lahir")||g(r,"tgl"))});
   if(++n%400===0){await b.commit();b=writeBatch(db)}}
  await b.commit();alert(n+" siswa berhasil diupload.");go("Siswa");
};
</script>
