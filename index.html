<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyIgi - MA Insan Generasi Islami</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0f5132;--g2:#157347;--gold:#c8962e;--bg:#f6f4ee;--ink:#1c2b24}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.btn{background:var(--g);color:#fff;border-radius:.75rem;padding:.6rem 1rem;font-weight:700;font-size:.875rem}
.btn:hover{background:var(--g2)}.btn2{background:#fff;border:1px solid #d6d3c7;border-radius:.75rem;padding:.5rem .9rem;font-weight:600;font-size:.8rem}
.inp{width:100%;border:1px solid #d6d3c7;border-radius:.75rem;padding:.6rem .8rem;background:#fff;font-size:.9rem}
.card{background:#fff;border:1px solid #e5e2d6;border-radius:1rem;padding:1rem}
.tab{padding:.5rem .9rem;border-radius:999px;font-weight:700;font-size:.8rem;white-space:nowrap;background:#fff;border:1px solid #d6d3c7}
.tab.on{background:var(--g);color:#fff;border-color:var(--g)}
.hero{background:linear-gradient(135deg,#0f5132,#157347 60%,#1f8a5b);color:#fff;border-radius:1.25rem;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:26px solid rgba(200,150,46,.35)}
.pill{font-size:.7rem;font-weight:700;padding:.15rem .6rem;border-radius:999px}
.hidden{display:none}
.acc{position:relative;width:42px;height:42px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center}
.bdg2{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e11d48;color:#fff;font-size:.65rem;font-weight:800;align-items:center;justify-content:center;padding:0 4px}
.menu{position:absolute;right:0;top:50px;width:230px;background:#fff;border:1px solid #e5e2d6;border-radius:1rem;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:.4rem;z-index:50}
.mi{display:flex;align-items:center;gap:.75rem;width:100%;padding:.6rem .75rem;border-radius:.6rem;font-size:.875rem;font-weight:600;text-align:left}
.mi:hover{background:#f1efe6}
.tile{background:#fff;border:1px solid #e5e2d6;border-radius:1rem;padding:1.1rem .5rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;box-shadow:0 1px 2px rgba(0,0,0,.04);width:100%}
.tile:hover{border-color:var(--g);transform:translateY(-1px)}
</style>
</head>
<body>
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-sm space-y-4 p-6">
    <div class="text-center"><div class="text-3xl font-extrabold" style="color:var(--g)">MyIgi</div><p class="text-sm text-slate-500">MA Insan Generasi Islami</p></div>
    <input id="u" class="inp" placeholder="NISN / Username guru" inputmode="numeric">
    <input id="p" type="password" class="inp" placeholder="Sandi (siswa: ddmmyyyy, contoh 12092004)">
    <p id="err" class="text-sm text-rose-600 hidden"></p>
    <button class="btn w-full" onclick="doLogin()">Masuk</button>
  </div>
</div>

<div id="app" class="hidden max-w-5xl mx-auto p-4 space-y-4">
  <header class="flex items-center justify-between">
    <div onclick="home()" style="cursor:pointer"><div class="font-extrabold text-xl" style="color:var(--g)">MyIgi</div><div class="text-xs text-slate-500">MA Insan Generasi Islami</div></div>
    <div class="relative"><button id="acc" class="acc" onclick="toggleMenu(event)" aria-label="Akun"></button><div id="menu" class="menu hidden"></div></div>
  </header>
  <nav id="tabs" class="flex gap-2 overflow-x-auto pb-1"></nav>
  <main id="main"></main>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import {getFirestore,collection,getDocs,doc,setDoc,addDoc,updateDoc,deleteDoc,getDoc,writeBatch} from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// === GANTI DENGAN CONFIG FIREBASE BARU ANDA (lihat langkah-langkah) ===
const firebaseConfig={apiKey:"AIzaSyClGgcUyZj16x1XpbGGFkIdbQC9OSqnvtw",authDomain:"apa-1c339.firebaseapp.com",projectId:"apa-1c339",storageBucket:"apa-1c339.firebasestorage.app",messagingSenderId:"446205639535",appId:"1:446205639535:web:3ac4916c616089f15f869a"};
const db=getFirestore(initializeApp(firebaseConfig));
const ADMIN={u:"admin",p:"RUGEK.aja234817"};
const key=s=>String(s??"").toLowerCase().replace(/[^a-z0-9]/g,"");
const DEF_JADWAL=[{"kelas": 10, "mapel": "Matematika", "jam": "07:00 - 08:30", "guru": "Budi Santoso, S.Pd."}, {"kelas": 10, "mapel": "Bahasa Indonesia", "jam": "08:30 - 10:00", "guru": "Siti Aminah, M.Pd."}, {"kelas": 10, "mapel": "Istirahat", "jam": "10:00 - 10:30", "guru": "-"}, {"kelas": 10, "mapel": "Ilmu Pengetahuan Alam (IPA)", "jam": "10:30 - 12:00", "guru": "Drs. Ahmad Hidayat"}, {"kelas": 10, "mapel": "Pendidikan Pancasila", "jam": "12:45 - 14:15", "guru": "Dewi Lestari, S.H."}, {"kelas": 11, "mapel": "Matematika", "jam": "07:00 - 08:30", "guru": "Budi Santoso, S.Pd."}, {"kelas": 11, "mapel": "Bahasa Indonesia", "jam": "08:30 - 10:00", "guru": "Siti Aminah, M.Pd."}, {"kelas": 11, "mapel": "Istirahat", "jam": "10:00 - 10:30", "guru": "-"}, {"kelas": 11, "mapel": "Ilmu Pengetahuan Alam (IPA)", "jam": "10:30 - 12:00", "guru": "Drs. Ahmad Hidayat"}, {"kelas": 11, "mapel": "Pendidikan Pancasila", "jam": "12:45 - 14:15", "guru": "Dewi Lestari, S.H."}, {"kelas": 12, "mapel": "Matematika", "jam": "07:00 - 08:30", "guru": "Budi Santoso, S.Pd."}, {"kelas": 12, "mapel": "Bahasa Indonesia", "jam": "08:30 - 10:00", "guru": "Siti Aminah, M.Pd."}, {"kelas": 12, "mapel": "Istirahat", "jam": "10:00 - 10:30", "guru": "-"}, {"kelas": 12, "mapel": "Ilmu Pengetahuan Alam (IPA)", "jam": "10:30 - 12:00", "guru": "Drs. Ahmad Hidayat"}, {"kelas": 12, "mapel": "Pendidikan Pancasila", "jam": "12:45 - 14:15", "guru": "Dewi Lestari, S.H."}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const all=async n=>(await getDocs(collection(db,n))).docs.map(d=>({id:d.id,...d.data()}));
const today=()=>new Date().toISOString().slice(0,10);
let me=null,isAdmin=false,tab="",siswa=[];

window.doLogin=async()=>{
  const u=$("u").value.trim(),p=$("p").value.trim();$("err").classList.add("hidden");
  try{
    let g=null;
    if(u.toLowerCase()===ADMIN.u&&p===ADMIN.p) g={nama:"Admin"};
    else if(key(u)){ const d=await getDoc(doc(db,"guru",key(u))); if(d.exists()&&d.data().sandi===p) g=d.data(); }
    if(g){ isAdmin=true; me={nama:g.nama}; }
    else{ const s=await getDoc(doc(db,"siswa",u)); if(!s.exists()||s.data().tgl!==p)throw 0; me=s.data(); isAdmin=false; }
  }catch(e){$("err").textContent="NISN/username atau sandi salah.";$("err").classList.remove("hidden");return}
  sessionStorage.setItem("me",JSON.stringify({u,p}));
  start();
};
window.logout=()=>{sessionStorage.clear();location.reload()};
const saved=sessionStorage.getItem("me");
if(saved){const s=JSON.parse(saved);$("u").value=s.u;$("p").value=s.p;doLogin()}

const svg=p=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={user:svg('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),
 bell:svg('<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>'),
 help:svg('<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>'),
 out:svg('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>')};
window.toggleMenu=e=>{e.stopPropagation();$("menu").classList.toggle("hidden")};
document.addEventListener("click",()=>$("menu")&&$("menu").classList.add("hidden"));
window.home=()=>{if(!isAdmin)go("Beranda")};
function start(){
  $("login").classList.add("hidden");$("app").classList.remove("hidden");
  const t=["Siswa","Guru","Jadwal","Pengumuman","Pelanggaran","Prestasi","Tugas","Absensi","Rekap","Pembayaran","Bantuan"];
  if(isAdmin){$("tabs").style.display="";$("tabs").innerHTML=t.map(x=>`<button class="tab" data-t="${x}" onclick="go('${x}')">${x==="Rekap"?"Rekap Kehadiran":x}</button>`).join("")}
  else{$("tabs").style.display="none";$("tabs").innerHTML=""}
  $("menu").innerHTML=`<div class="px-3 py-2 border-b mb-1"><div class="font-bold text-sm">${esc(me.nama)}</div><div class="text-xs text-slate-500">${isAdmin?"Guru / Admin":esc(me.kelas)}</div></div>`
   +(isAdmin?"":`<button class="mi" onclick="go('Notifikasi')">${IC.bell}<span>Notifikasi</span><span id="bdg" class="ml-auto"></span></button><button class="mi" onclick="go('Bantuan')">${IC.help}<span>Bantuan (CS)</span></button>`)
   +`<button class="mi" style="color:#be123c" onclick="logout()">${IC.out}<span>Keluar</span></button>`;
  $("acc").innerHTML=IC.user+'<span id="bdg2" class="bdg2" style="display:none"></span>';
  go(isAdmin?t[0]:"Beranda");
  if(!isAdmin)refreshBadge();
}
window.go=async n=>{
  tab=n;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===n));
  $("main").innerHTML='<p class="text-slate-500">Memuat…</p>';
  if(isAdmin)siswa=await all("siswa");
  const back=!isAdmin&&n!=="Beranda"?`<button class="btn2 mb-3" onclick="go('Beranda')">← Beranda</button>`:"";
  $("main").innerHTML=back+await (isAdmin?A:S)[n]();
  if(isAdmin&&n==="Rekap")loadRekap();
  window.scrollTo(0,0);
};
const opts=(a,sel)=>a.map(s=>`<option value="${s.nisn}">${esc(s.nama)} - ${esc(s.kelas)}</option>`).join("");
const empty=t=>`<p class="text-slate-500 text-sm">${t}</p>`;
const list=(a,f,e)=>a.length?a.map(f).join(""):empty(e);
const fileB64=f=>new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)});

// ============ SISWA ============
const S={
Beranda:async()=>{
  const [pel,pr,ab]=await Promise.all([all("pelanggaran"),all("prestasi"),all("absensi")]);
  const mine=a=>a.filter(x=>x.nisn===me.nisn);
  const alpha=mine(ab).filter(x=>x.status==="A").length;
  return `<section class="hero p-6 space-y-3"><p class="text-sm opacity-80">Assalamu'alaikum,</p>
  <h1 class="text-2xl sm:text-3xl font-extrabold">${esc(me.nama)}</h1>
  <div class="grid grid-cols-3 gap-3 text-sm pt-2 max-w-md"><div><div class="opacity-70 text-xs">Nama</div><b>${esc(me.nama)}</b></div><div><div class="opacity-70 text-xs">Kelas</div><b>${esc(me.kelas)}</b></div><div><div class="opacity-70 text-xs">NISN</div><b>${esc(me.nisn)}</b></div></div></section>
  <section class="grid grid-cols-3 gap-3 mt-4">${[["Jadwal","📅"],["Tugas","📝"],["Pembayaran","💳"]].map(([t,i])=>`<button class="tile" onclick="go('${t}')"><span class="text-3xl">${i}</span><span class="text-sm font-bold">${t}</span></button>`).join("")}</section>
  <section class="grid grid-cols-3 gap-3 mt-4">
   <div class="card text-center"><div class="text-3xl font-extrabold text-rose-600">${alpha}</div><div class="text-xs text-slate-500">Alpha</div></div>
   <button class="card text-center" onclick="go('Pelanggaran')"><div class="text-3xl font-extrabold text-amber-600">${mine(pel).length}</div><div class="text-xs text-slate-500">Pelanggaran</div><div class="text-[10px] text-slate-400 mt-1">Lihat semua ›</div></button>
   <button class="card text-center" onclick="go('Prestasi')"><div class="text-3xl font-extrabold" style="color:var(--g)">${mine(pr).length}</div><div class="text-xs text-slate-500">Prestasi</div><div class="text-[10px] text-slate-400 mt-1">Lihat semua ›</div></button></section>`;
},
Pelanggaran:async()=>`<h2 class="font-extrabold mb-2">Semua Pelanggaran</h2>`+list((await all("pelanggaran")).filter(x=>x.nisn===me.nisn).sort((a,b)=>b.waktu>a.waktu?1:-1),x=>`<div class="card mb-2" style="border-left:4px solid #e11d48">⚠️ <b>${esc(x.ket)}</b><div class="text-xs text-slate-500">${esc(x.waktu)}</div></div>`,"Tidak ada catatan pelanggaran."),
Prestasi:async()=>`<h2 class="font-extrabold mb-2">Semua Prestasi</h2>`+list((await all("prestasi")).filter(x=>x.nisn===me.nisn),x=>`<div class="card mb-2" style="border-left:4px solid var(--gold)">🏆 <b>${esc(x.judul)}</b><div class="text-xs text-slate-500">${esc(x.tgl)} - ${esc(x.ket)}</div></div>`,"Belum ada prestasi."),
Jadwal:()=>jadwalHTML(parseInt(me.kelas)),
Notifikasi:async()=>{
  const p=(await all("pengumuman")).sort((a,b)=>b.waktu>a.waktu?1:-1),prev=getSeen();
  setSeen(p[0]?.waktu||"");clearBadge();
  return list(p,x=>`<div class="card mb-2" style="border-left:4px solid var(--gold)"><div class="flex justify-between gap-2"><b>📢 ${esc(x.judul)}</b>${x.waktu>prev?'<span class="pill bg-rose-100 text-rose-700 h-fit">Baru</span>':""}</div><p class="text-sm mt-1 whitespace-pre-line">${esc(x.isi)}</p><div class="text-xs text-slate-500 mt-1">${fmtWaktu(x.waktu)}</div></div>`,"Belum ada pengumuman.");
},
Tugas:async()=>{
  const t=(await all("tugas")).filter(x=>x.nisn===me.nisn).sort((a,b)=>b.tgl>a.tgl?1:-1);
  return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Kumpulkan tugas</h2>
  <input id="tm" class="inp" placeholder="Mata pelajaran"><input id="tj" class="inp" placeholder="Judul tugas">
  <input id="tl" class="inp" placeholder="Link tugas (opsional, mis. Google Drive)"><input id="tf" type="file" class="inp">
  <p class="text-xs text-slate-500">File maksimal 700 KB. Untuk file besar, pakai link.</p><button class="btn" onclick="kirimTugas()">Kirim tugas</button></div>`+
  list(t,x=>`<div class="card mb-2"><div class="flex justify-between gap-2"><b>${esc(x.judul)}</b><span class="pill ${x.status==="Selesai"?"bg-emerald-100 text-emerald-700":x.status==="Revisi"?"bg-amber-100 text-amber-700":"bg-slate-100"}">${esc(x.status)}</span></div><div class="text-xs text-slate-500">${esc(x.mapel)} - ${esc(x.tgl)}</div>${x.nilai!==""&&x.nilai!=null?`<div class="text-sm mt-1">Nilai: <b>${esc(x.nilai)}</b></div>`:""}</div>`,"Belum ada tugas dikirim.");
},
Pembayaran:async()=>{
  const q=(await getDoc(doc(db,"pengaturan","qris"))).data()?.url;
  const p=(await all("pembayaran")).filter(x=>x.nisn===me.nisn);
  return `<div class="card space-y-3 mb-4"><h2 class="font-extrabold">Pembayaran</h2>
  ${q?`<img src="${esc(q)}" alt="QRIS" class="w-56 rounded-xl border">`:empty("QRIS belum tersedia. Bayar tunai ke bagian administrasi.")}
  <p class="text-sm">Bayar lewat QRIS atau tunai, lalu lapor di sini.</p>
  <select id="pm" class="inp"><option>QRIS</option><option>Tunai</option></select><input id="pj" type="number" class="inp" placeholder="Jumlah (Rp)"><input id="pk" class="inp" placeholder="Keterangan (mis. SPP Oktober)">
  <button class="btn" onclick="kirimBayar()">Kirim laporan</button></div>`+list(p,x=>`<div class="card mb-2 flex justify-between"><div><b>Rp ${Number(x.jumlah).toLocaleString("id-ID")}</b> - ${esc(x.metode)}<div class="text-xs text-slate-500">${esc(x.ket)} - ${esc(x.tgl)}</div></div><span class="pill bg-slate-100 h-fit">${esc(x.status)}</span></div>`,"Belum ada pembayaran.");
},
Bantuan:async()=>{
  const b=(await all("bantuan")).filter(x=>x.nisn===me.nisn);
  return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Butuh bantuan?</h2><textarea id="bp" class="inp" rows="3" placeholder="Tulis pesan Anda"></textarea><button class="btn" onclick="kirimBantuan()">Kirim</button></div>`+list(b,x=>`<div class="card mb-2"><p>${esc(x.pesan)}</p>${x.balasan?`<p class="text-sm mt-2 p-2 rounded-lg" style="background:#e8f3ec"><b>Admin:</b> ${esc(x.balasan)}</p>`:'<p class="text-xs text-slate-400 mt-1">Menunggu balasan</p>'}</div>`,"Belum ada pesan.");
}};

window.kirimTugas=async()=>{
  const m=$("tm").value.trim(),j=$("tj").value.trim(),l=$("tl").value.trim(),f=$("tf").files[0];
  if(!m||!j||(!l&&!f))return alert("Isi mapel, judul, dan link atau file.");
  if(f&&f.size>700000)return alert("File terlalu besar. Pakai link.");
  await addDoc(collection(db,"tugas"),{nisn:me.nisn,nama:me.nama,kelas:me.kelas,mapel:m,judul:j,link:l,file:f?await fileB64(f):"",namaFile:f?.name||"",tgl:today(),nilai:"",status:"Menunggu"});
  go("Tugas");
};
window.kirimBayar=async()=>{
  const j=$("pj").value;if(!j)return alert("Isi jumlah.");
  await addDoc(collection(db,"pembayaran"),{nisn:me.nisn,nama:me.nama,metode:$("pm").value,jumlah:+j,ket:$("pk").value,tgl:today(),status:"Menunggu"});go("Pembayaran");
};
window.kirimBantuan=async()=>{const t=$("bp").value.trim();if(!t)return;await addDoc(collection(db,"bantuan"),{nisn:me.nisn,nama:me.nama,pesan:t,balasan:""});go("Bantuan")};

// ============ ADMIN ============
const sel=(id)=>`<select id="${id}" class="inp">${opts(siswa)}</select>`;
const A={
Rekap:async()=>{const k=[...new Set(siswa.map(x=>x.kelas))].sort(),t=today();
 return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Rekap kehadiran siswa</h2>
 <select id="rkk" class="inp" onchange="loadRekap()"><option value="">Semua kelas</option>${k.map(x=>`<option>${esc(x)}</option>`).join("")}</select>
 <div class="grid grid-cols-2 gap-2"><div><label class="text-xs text-slate-500">Dari tanggal</label><input id="rka" type="date" class="inp" value="${t.slice(0,8)}01" onchange="loadRekap()"></div><div><label class="text-xs text-slate-500">Sampai tanggal</label><input id="rkb" type="date" class="inp" value="${t}" onchange="loadRekap()"></div></div>
 <button class="btn" onclick="exportRekap()">⬇ Ekspor ke Excel</button></div><div id="rks"></div>`},
Guru:async()=>{const g=(await all("guru")).sort((a,b)=>a.nama>b.nama?1:-1);
 return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Upload data guru</h2><p class="text-xs text-slate-500">File .xlsx atau .csv dengan kolom: NAMA GURU, SANDI. Username login = nama guru (huruf besar/kecil, spasi, dan tanda baca diabaikan). Akun dengan nama yang sama akan diperbarui.</p><input id="gf" type="file" accept=".xlsx,.xls,.csv" class="inp"><button class="btn" onclick="importGuru()">Upload</button></div>
 <p class="text-sm mb-2">${g.length} akun guru</p>`+list(g,x=>`<div class="card mb-2 flex justify-between"><div><b>${esc(x.nama)}</b><div class="text-xs text-slate-500">Sandi: <span class="font-mono">${esc(x.sandi)}</span></div></div><button class="btn2" onclick="hapus('guru','${x.id}','Guru')">Hapus</button></div>`,"Belum ada data guru. Upload file dari sheet AKUN GURU.")},
Jadwal:async()=>`<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Upload jadwal pelajaran</h2><p class="text-xs text-slate-500">File .xlsx atau .csv dengan kolom: MATA PELAJARAN, JAM, NAMA GURU, KELAS (kelas boleh diisi sekali di baris pertama tiap kelompok). Upload baru menggantikan jadwal lama.</p><input id="jf" type="file" accept=".xlsx,.xls,.csv" class="inp"><button class="btn" onclick="importJadwal()">Upload</button></div>`+await jadwalHTML(),
Pengumuman:async()=>{const p=(await all("pengumuman")).sort((a,b)=>b.waktu>a.waktu?1:-1);
 return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Buat pengumuman</h2><input id="pu" class="inp" placeholder="Judul pengumuman"><textarea id="pi" class="inp" rows="4" placeholder="Isi pengumuman"></textarea><p class="text-xs text-slate-500">Pengumuman akan muncul di menu Notifikasi semua siswa.</p><button class="btn" onclick="addInfo()">Kirim pengumuman</button></div>`+list(p,x=>`<div class="card mb-2 flex justify-between gap-2"><div><b>📢 ${esc(x.judul)}</b><p class="text-sm whitespace-pre-line">${esc(x.isi)}</p><div class="text-xs text-slate-500">${fmtWaktu(x.waktu)}${x.oleh?" - "+esc(x.oleh):""}</div></div><button class="btn2 h-fit" onclick="hapus('pengumuman','${x.id}','Pengumuman')">Hapus</button></div>`,"Belum ada pengumuman.")},
Siswa:async()=>`<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Upload data siswa</h2><p class="text-xs text-slate-500">File .xlsx atau .csv dengan kolom: NAMA, KELAS, NISN, TGL LAHIR. Sandi siswa = tanggal lahir (ddmmyyyy).</p><input id="xf" type="file" accept=".xlsx,.xls,.csv" class="inp"><button class="btn" onclick="importSiswa()">Upload</button></div>
 <p class="text-sm mb-2">${siswa.length} siswa</p>`+list(siswa.sort((a,b)=>a.kelas>b.kelas?1:-1),x=>`<div class="card mb-2 flex justify-between"><div><b>${esc(x.nama)}</b><div class="text-xs text-slate-500">${esc(x.kelas)} - ${esc(x.nisn)}</div></div><button class="btn2" onclick="hapus('siswa','${x.id}','Siswa')">Hapus</button></div>`,"Belum ada data siswa."),
Pelanggaran:async()=>{const p=(await all("pelanggaran")).sort((a,b)=>b.waktu>a.waktu?1:-1);
 return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Input pelanggaran</h2>${sel("ps")}<input id="pk" class="inp" placeholder="Keterangan pelanggaran"><input id="pw" type="datetime-local" class="inp"><button class="btn" onclick="addPel()">Simpan</button></div>`+list(p,x=>`<div class="card mb-2 flex justify-between"><div><b>${esc(x.nama)}</b> (${esc(x.kelas)})<div class="text-sm">${esc(x.ket)}</div><div class="text-xs text-slate-500">${esc(x.waktu)}</div></div><button class="btn2" onclick="hapus('pelanggaran','${x.id}','Pelanggaran')">Hapus</button></div>`,"Belum ada pelanggaran.")},
Tugas:async()=>{const t=(await all("tugas")).sort((a,b)=>b.tgl>a.tgl?1:-1);const m=[...new Set(t.map(x=>x.mapel))];
 return `<div class="card mb-4"><select id="fm" class="inp" onchange="filterTugas()"><option value="">Semua pelajaran</option>${m.map(x=>`<option>${esc(x)}</option>`).join("")}</select></div><div id="tl">${list(t,x=>`<div class="card mb-2 tg" data-m="${esc(x.mapel)}"><div class="flex justify-between gap-2"><div><b>${esc(x.judul)}</b><div class="text-xs text-slate-500">${esc(x.nama)} (${esc(x.kelas)}) - ${esc(x.mapel)} - ${esc(x.tgl)}</div></div><span class="pill bg-slate-100 h-fit">${esc(x.status)}</span></div>
 <div class="text-sm mt-1">${x.link?`<a class="underline text-emerald-700" target="_blank" href="${esc(x.link)}">Buka link</a> `:""}${x.file?`<a class="underline text-emerald-700" download="${esc(x.namaFile)}" href="${x.file}">Unduh ${esc(x.namaFile)}</a>`:""}</div>
 <div class="flex gap-2 mt-2"><input id="n${x.id}" class="inp" style="max-width:90px" placeholder="Nilai" value="${esc(x.nilai)}"><select id="s${x.id}" class="inp" style="max-width:130px">${["Menunggu","Revisi","Selesai"].map(s=>`<option ${s===x.status?"selected":""}>${s}</option>`).join("")}</select><button class="btn" onclick="nilai('${x.id}')">Simpan</button></div></div>`,"Belum ada tugas masuk.")}</div>`},
Prestasi:async()=>{const p=await all("prestasi");
 return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Input prestasi</h2>${sel("ps")}<input id="pj" class="inp" placeholder="Nama prestasi"><input id="pk" class="inp" placeholder="Keterangan (juara, tingkat)"><input id="pt" type="date" class="inp" value="${today()}"><button class="btn" onclick="addPrestasi()">Simpan</button></div>`+list(p,x=>`<div class="card mb-2 flex justify-between"><div>🏆 <b>${esc(x.judul)}</b> - ${esc(x.nama)}<div class="text-xs text-slate-500">${esc(x.tgl)} - ${esc(x.ket)}</div></div><button class="btn2" onclick="hapus('prestasi','${x.id}','Prestasi')">Hapus</button></div>`,"Belum ada prestasi.")},
Absensi:async()=>{const k=[...new Set(siswa.map(x=>x.kelas))].sort();
 return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Absensi siswa</h2><div class="flex gap-2"><select id="ak" class="inp" onchange="loadAbsen()"><option value="">Pilih kelas</option>${k.map(x=>`<option>${esc(x)}</option>`).join("")}</select><input id="at" type="date" class="inp" value="${today()}" onchange="loadAbsen()"></div></div><div id="ab"></div>`},
Pembayaran:async()=>{const p=(await all("pembayaran")).sort((a,b)=>b.tgl>a.tgl?1:-1);const q=(await getDoc(doc(db,"pengaturan","qris"))).data()?.url||"";
 return `<div class="card space-y-2 mb-4"><h2 class="font-extrabold">Gambar QRIS</h2><input id="qu" class="inp" placeholder="Link gambar QRIS" value="${esc(q)}"><button class="btn" onclick="setQris()">Simpan QRIS</button></div>`+list(p,x=>`<div class="card mb-2"><b>${esc(x.nama)}</b> - Rp ${Number(x.jumlah).toLocaleString("id-ID")} (${esc(x.metode)})<div class="text-xs text-slate-500">${esc(x.ket)} - ${esc(x.tgl)}</div><div class="flex gap-2 mt-2"><span class="pill bg-slate-100">${esc(x.status)}</span><button class="btn2" onclick="bayarOk('${x.id}')">Tandai lunas</button></div></div>`,"Belum ada pembayaran.")},
Bantuan:async()=>list(await all("bantuan"),x=>`<div class="card mb-2"><b>${esc(x.nama)}</b><p class="text-sm">${esc(x.pesan)}</p><div class="flex gap-2 mt-2"><input id="r${x.id}" class="inp" placeholder="Balasan" value="${esc(x.balasan)}"><button class="btn" onclick="balas('${x.id}')">Kirim</button></div></div>`,"Belum ada pesan.")
};
const sw=n=>siswa.find(s=>s.nisn===n)||{};
window.hapus=async(c,id,t)=>{if(confirm("Hapus data ini?")){await deleteDoc(doc(db,c,id));go(t)}};
window.addPel=async()=>{const s=sw($("ps").value);if(!$("pk").value||!$("pw").value)return alert("Lengkapi keterangan dan waktu.");await addDoc(collection(db,"pelanggaran"),{nisn:s.nisn,nama:s.nama,kelas:s.kelas,ket:$("pk").value,waktu:$("pw").value.replace("T"," ")});go("Pelanggaran")};
window.addPrestasi=async()=>{const s=sw($("ps").value);if(!$("pj").value)return alert("Isi nama prestasi.");await addDoc(collection(db,"prestasi"),{nisn:s.nisn,nama:s.nama,judul:$("pj").value,ket:$("pk").value,tgl:$("pt").value});go("Prestasi")};
window.nilai=async id=>{await updateDoc(doc(db,"tugas",id),{nilai:$("n"+id).value,status:$("s"+id).value});alert("Tersimpan.")};
window.filterTugas=()=>{const v=$("fm").value;document.querySelectorAll(".tg").forEach(e=>e.style.display=!v||e.dataset.m===v?"":"none")};
window.setQris=async()=>{await setDoc(doc(db,"pengaturan","qris"),{url:$("qu").value});alert("Tersimpan.")};
window.bayarOk=async id=>{await updateDoc(doc(db,"pembayaran",id),{status:"Lunas"});go("Pembayaran")};
window.balas=async id=>{await updateDoc(doc(db,"bantuan",id),{balasan:$("r"+id).value});alert("Terkirim.")};
window.loadAbsen=async()=>{
  const k=$("ak").value,t=$("at").value;if(!k)return($("ab").innerHTML="");
  const ex=(await all("absensi")).filter(x=>x.kelas===k&&x.tgl===t);
  $("ab").innerHTML=siswa.filter(s=>s.kelas===k).sort((a,b)=>a.nama>b.nama?1:-1).map(s=>{const c=ex.find(x=>x.nisn===s.nisn)?.status||"H";
   return `<div class="card mb-2 flex justify-between items-center"><b class="text-sm">${esc(s.nama)}</b><div class="flex gap-3 text-sm">${["H","I","A"].map(v=>`<label><input type="radio" name="a${s.nisn}" value="${v}" ${v===c?"checked":""}> ${v}</label>`).join("")}</div></div>`}).join("")+`<button class="btn" onclick="saveAbsen()">Simpan absensi</button>`;
};
window.saveAbsen=async()=>{
  const k=$("ak").value,t=$("at").value,b=writeBatch(db);
  siswa.filter(s=>s.kelas===k).forEach(s=>{const v=document.querySelector(`input[name=a${s.nisn}]:checked`).value;b.set(doc(db,"absensi",`${t}_${s.nisn}`),{nisn:s.nisn,nama:s.nama,kelas:k,tgl:t,status:v})});
  await b.commit();alert("Absensi tersimpan.");
};
window.importSiswa=async()=>{
  const f=$("xf").files[0];if(!f)return alert("Pilih file.");
  const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
  const g=(r,k)=>r[Object.keys(r).find(h=>h.toLowerCase().includes(k))]??"";
  const fmt=v=>{if(v instanceof Date){const p=n=>String(n).padStart(2,"0");return p(v.getDate())+p(v.getMonth()+1)+v.getFullYear()}return String(v).replace(/\D/g,"")};
  let n=0,b=writeBatch(db);
  for(const r of rows){const nisn=String(g(r,"nisn")).trim(),nama=String(g(r,"nama")).trim();if(!nisn||!nama)continue;
   b.set(doc(db,"siswa",nisn),{nisn,nama,kelas:String(g(r,"kelas")).trim(),tgl:fmt(g(r,"lahir")||g(r,"tgl"))});
   if(++n%400===0){await b.commit();b=writeBatch(db)}}
  await b.commit();alert(n+" siswa berhasil diupload.");go("Siswa");
};

// ============ JADWAL / NOTIFIKASI / GURU ============
let JR=[];
const fmtWaktu=w=>{const d=new Date(w);return isNaN(d)?esc(w):d.toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"})};
const seenK=()=>"seen_"+(me?.nisn||"x");
const getSeen=()=>{try{return localStorage.getItem(seenK())||""}catch(e){return ""}};
const setSeen=v=>{try{localStorage.setItem(seenK(),v)}catch(e){}};
const setBadge=n=>{if($("bdg"))$("bdg").innerHTML=n?`<span class="pill bg-rose-600 text-white">${n}</span>`:"";if($("bdg2")){$("bdg2").textContent=n||"";$("bdg2").style.display=n?"flex":"none"}};
const clearBadge=()=>setBadge(0);
window.refreshBadge=async()=>{try{const s=getSeen();setBadge((await all("pengumuman")).filter(x=>x.waktu>s).length)}catch(e){}};
const getJadwal=async()=>{try{const d=await getDoc(doc(db,"pengaturan","jadwal"));if(d.exists()&&d.data().rows?.length)return d.data().rows}catch(e){}return DEF_JADWAL};
const jadwalTbl=k=>{const r=JR.filter(x=>x.kelas===k);
  return r.length?`<div class="card overflow-x-auto p-0"><table class="w-full text-sm"><thead style="background:var(--g);color:#fff"><tr><th class="text-left p-3">Jam</th><th class="text-left p-3">Mata Pelajaran</th><th class="text-left p-3">Guru</th></tr></thead><tbody>`+r.map(x=>{const br=/istirahat/i.test(x.mapel);return `<tr class="border-t" ${br?'style="background:#fbf3df"':""}><td class="p-3 whitespace-nowrap font-semibold">${esc(x.jam)}</td><td class="p-3">${br?"☕ ":""}${esc(x.mapel)}</td><td class="p-3">${esc(x.guru)}</td></tr>`}).join("")+`</tbody></table></div>`:empty("Belum ada jadwal untuk kelas ini.")};
const jadwalHTML=async def=>{JR=await getJadwal();const ks=[...new Set(JR.map(x=>x.kelas))].sort((a,b)=>a-b);if(!ks.length)return empty("Belum ada jadwal.");const d=ks.includes(def)?def:ks[0];
  return `<div class="card mb-4 flex items-center gap-3"><b class="text-sm">Jadwal Pelajaran Kelas</b><select id="jk" class="inp" style="max-width:110px" onchange="renderJadwal()">${ks.map(k=>`<option ${k===d?"selected":""}>${k}</option>`).join("")}</select></div><div id="jt">${jadwalTbl(d)}</div>`};
window.renderJadwal=()=>{$("jt").innerHTML=jadwalTbl(+$("jk").value)};
const readSheet=async id=>{const f=$(id).files[0];if(!f){alert("Pilih file.");return null}
  const wb=XLSX.read(await f.arrayBuffer());return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""})};
const gv=(r,k)=>r[Object.keys(r).find(h=>h.toLowerCase().includes(k))]??"";
window.importGuru=async()=>{
  const rows=await readSheet("gf");if(!rows)return;
  let n=0,b=writeBatch(db);
  for(const r of rows){const nama=String(gv(r,"nama")).trim(),sandi=String(gv(r,"sandi")).trim(),id=key(nama);if(!id||!sandi)continue;
   b.set(doc(db,"guru",id),{nama,sandi});if(++n%400===0){await b.commit();b=writeBatch(db)}}
  await b.commit();alert(n+" akun guru berhasil diupload.");go("Guru");
};
window.importJadwal=async()=>{
  const rows=await readSheet("jf");if(!rows)return;
  const out=[];let k=null;
  for(const r of rows){const kk=parseInt(String(gv(r,"kelas")));if(!isNaN(kk))k=kk;const mapel=String(gv(r,"mata")).trim();if(!mapel||k==null)continue;
   out.push({kelas:k,mapel,jam:String(gv(r,"jam")).trim(),guru:String(gv(r,"guru")).trim()})}
  if(!out.length)return alert("Tidak ada data jadwal yang terbaca. Cek nama kolom.");
  await setDoc(doc(db,"pengaturan","jadwal"),{rows:out});alert(out.length+" baris jadwal tersimpan.");go("Jadwal");
};
window.addInfo=async()=>{
  const j=$("pu").value.trim(),i=$("pi").value.trim();if(!j||!i)return alert("Isi judul dan isi pengumuman.");
  await addDoc(collection(db,"pengumuman"),{judul:j,isi:i,waktu:new Date().toISOString(),oleh:me.nama});go("Pengumuman");
};

// ============ REKAP KEHADIRAN ============
let RK=null;
const stLabel={H:"Hadir",I:"Izin",A:"Alpha"};
window.loadRekap=async()=>{
  const kls=$("rkk").value,d1=$("rka").value,d2=$("rkb").value;
  if(!d1||!d2||d1>d2){RK=null;$("rks").innerHTML=empty("Periode tanggal tidak valid.");return}
  $("rks").innerHTML=empty("Memuat…");
  const ab=(await all("absensi")).filter(x=>x.tgl>=d1&&x.tgl<=d2&&(!kls||x.kelas===kls));
  const sis=siswa.filter(s=>!kls||s.kelas===kls).sort((a,b)=>a.kelas===b.kelas?(a.nama>b.nama?1:-1):(a.kelas>b.kelas?1:-1));
  const rows=sis.map(s=>{const a=ab.filter(x=>x.nisn===s.nisn),c=v=>a.filter(x=>x.status===v).length,h=c("H");
   return{nama:s.nama,kelas:s.kelas,nisn:s.nisn,h,i:c("I"),a:c("A"),tot:a.length,pct:a.length?Math.round(h/a.length*100):null}});
  const days=new Set(ab.map(x=>x.tgl)).size;
  RK={rows,ab,d1,d2,kls};
  $("rks").innerHTML=`<p class="text-sm mb-2">${rows.length} siswa - ${days} hari absensi tercatat</p>`+(days?`<div class="card overflow-x-auto p-0"><table class="w-full text-sm"><thead style="background:var(--g);color:#fff"><tr><th class="text-left p-3">Nama</th><th class="p-3">Kelas</th><th class="p-3">H</th><th class="p-3">I</th><th class="p-3">A</th><th class="p-3">% Hadir</th></tr></thead><tbody>${rows.map(r=>`<tr class="border-t text-center"><td class="p-3 text-left font-semibold">${esc(r.nama)}</td><td class="p-3 whitespace-nowrap">${esc(r.kelas)}</td><td class="p-3">${r.h}</td><td class="p-3">${r.i}</td><td class="p-3 ${r.a?"text-rose-600 font-bold":""}">${r.a}</td><td class="p-3">${r.pct==null?"-":r.pct+"%"}</td></tr>`).join("")}</tbody></table></div>`:empty("Belum ada absensi pada periode ini."));
};
window.exportRekap=()=>{
  if(!RK||!RK.ab.length)return alert("Tidak ada data absensi untuk diekspor.");
  const {rows,ab,d1,d2,kls}=RK;
  const s1=[["REKAP KEHADIRAN SISWA"],["Periode: "+d1+" s/d "+d2+(kls?" | Kelas: "+kls:" | Semua kelas")],[],["No","Nama","Kelas","NISN","Hadir","Izin","Alpha","Total Pencatatan","% Hadir"],
   ...rows.map((r,i)=>[i+1,r.nama,r.kelas,r.nisn,r.h,r.i,r.a,r.tot,r.pct==null?"":r.pct/100])];
  const w1=XLSX.utils.aoa_to_sheet(s1);
  rows.forEach((r,i)=>{const c=w1["I"+(5+i)];if(c&&typeof c.v==="number")c.z="0%"});
  w1["!cols"]=[{wch:5},{wch:28},{wch:12},{wch:14},{wch:8},{wch:8},{wch:8},{wch:17},{wch:10}];
  const det=[...ab].sort((a,b)=>a.tgl===b.tgl?(a.kelas===b.kelas?(a.nama>b.nama?1:-1):(a.kelas>b.kelas?1:-1)):(a.tgl>b.tgl?1:-1));
  const w2=XLSX.utils.aoa_to_sheet([["Tanggal","Nama","Kelas","NISN","Status"],...det.map(x=>[x.tgl,x.nama,x.kelas,x.nisn,stLabel[x.status]||x.status])]);
  w2["!cols"]=[{wch:12},{wch:28},{wch:12},{wch:14},{wch:10}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,w1,"Rekap");XLSX.utils.book_append_sheet(wb,w2,"Detail Harian");
  XLSX.writeFile(wb,"Rekap_Kehadiran_"+d1+"_sd_"+d2+".xlsx");
};
</script>
</body>
</html>
